services:
  # Express Backend Web Service on Render
  - type: web
    name: student-attendance-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://your-frontend-app.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: attendance-postgres-db
          property: connectionString

# Managed PostgreSQL Database on Render
databases:
  - name: attendance-postgres-db
    plan: free
    databaseName: attendance_db
    user: attendance_admin
